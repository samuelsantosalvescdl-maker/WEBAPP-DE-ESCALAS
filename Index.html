<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Escalas</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .field { display: flex; flex-direction: column; min-width: 180px; }
    label { font-size: 12px; color: #444; }
    input, select, button { padding: 6px; }
    table { border-collapse: collapse; width: max-content; min-width: 100%; }
    th, td { border: 1px solid #ddd; padding: 4px; text-align: center; font-size: 12px; }
    th.sticky, td.sticky { position: sticky; left: 0; background: #fff; z-index: 2; }
    .status-Folga { background: #dff1ff; }
    .status-Dom\._mês { background: #ffe3e3; }
    .status-Abatimento { background: #e1f7e1; }
    .status-Licença, .status-Férias { background: #efe2ff; }
    .is-dobra { outline: 2px solid #ffbd6a; }
    .muted { color: #777; font-size: 11px; }
    .pill { border: 1px solid #aaa; border-radius: 10px; padding: 2px 8px; font-size: 11px; display: inline-block; }
  </style>
</head>
<body>
  <h2>Web App de Escalas</h2>
  <div class="row">
    <div class="field">
      <label>Empresa</label>
      <input list="empresaList" id="empresa" />
      <datalist id="empresaList"></datalist>
    </div>
    <div class="field">
      <label>Protocolos para carregar/fundir</label>
      <input id="protocolos" placeholder="PRT-..., PRT-..." />
    </div>
    <div class="field" style="justify-content:flex-end;">
      <button onclick="loadProtocols()">Carregar protocolos</button>
    </div>
  </div>

  <div id="headerFields"></div>
  <div id="tableWrap" style="overflow:auto; max-height: 70vh; margin-top: 12px;"></div>

  <div class="row" style="margin-top:12px;">
    <button onclick="addRow()">+ Linha</button>
    <button onclick="removeRow()">- Linha</button>
    <button onclick="enviarAnalise()">Enviar para análise</button>
    <button onclick="salvarCopia()">Salvar cópia</button>
    <button onclick="envioColab()">Envio colaboradores</button>
  </div>

  <script>
    let bootstrap = null;
    let model = {
      empresa: '', mes: '', ano: '', rows: [],
      feriados: {}, eventos: {}, prevFat: {}, weather: {},
      freelancerCount: 0,
    };

    const specialStatuses = ['Folga', 'Abatimento', 'Dom. mês', 'Licença', 'Férias'];

    function init() {
      google.script.run.withSuccessHandler(data => {
        bootstrap = data;
        model.feriados = data.feriados || {};
        model.eventos = data.eventos || {};
        model.prevFat = data.prevFat || {};
        model.weather = data.weather || {};
        document.getElementById('empresaList').innerHTML = data.empresas.map(e => `<option value="${e}"></option>`).join('');
        document.getElementById('empresa').addEventListener('change', onEmpresaChange);
        renderHeaderFields();
      }).getBootstrapData();
    }

    function onEmpresaChange() {
      const v = document.getElementById('empresa').value.trim();
      if (!bootstrap.empresas.includes(v)) return alert('Empresa inválida');
      model.empresa = v;
      model.rows = [];
      model.freelancerCount = 0;
      for (let i = 0; i < 2; i++) addRow();
      renderTable();
    }

    function renderHeaderFields() {
      const y = new Date().getFullYear();
      document.getElementById('headerFields').innerHTML = `
      <div class="row">
        ${field('valorTaxi','Valor Taxi (R$)','number','0.00')}
        ${field('valorRefeicao','Valor Refeição (R$)','number','0.00')}
        ${field('valorDobra','Valor Dobra (R$)','number','0.00')}
        ${field('emailAnalise','Email análise','email','')}
        ${field('duracaoIntervalo','Tempo intervalo (HH:MM)','text','01:00')}
      </div>
      <div class="row">
        ${field('maxSemIntervalo','Tempo máx sem intervalo','text','06:00')}
        ${field('protocolo','Protocolo(s)','text','')}
        ${field('mes','Mês','number','')}
        ${field('ano','Ano','number', y)}
        ${field('valorHoraFreelancer','Valor hora freelancer (R$)','number','0.00')}
      </div>`;
    }

    function field(id,label,type,value){
      return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${value}" /></div>`;
    }

    function daysInMonth() {
      return new Date(Number(v('ano')), Number(v('mes')), 0).getDate();
    }

    function addRow() {
      if (!model.empresa) return alert('Selecione a empresa.');
      if (model.rows.length >= 100) return;
      const d = Number(v('mes')) && Number(v('ano')) ? daysInMonth() : 31;
      model.rows.push({
        nome: '', funcao: '', escala: '', jornada: '', isFreelancer: false,
        days: Array.from({ length: d }, () => ({ entrada:'', intervalo:'', saida:'', exceptionMaxSemInt:false, exceptionExtra:false, exceptionEscala:false, isDobra:false }))
      });
      renderTable();
    }

    function removeRow() {
      if (model.rows.length <= 2) return;
      model.rows.pop();
      renderTable();
    }

    function validTime(t) { return /^\d{1,3}:\d{2}$/.test(t); }

    function renderTable() {
      const mes = Number(v('mes')); const ano = Number(v('ano'));
      if (!mes || !ano || !model.empresa) return;
      const dMax = daysInMonth();
      model.rows.forEach(r => {
        if (r.days.length !== dMax) r.days = Array.from({length:dMax},(_,i)=>r.days[i]||{ entrada:'', intervalo:'', saida:'', exceptionMaxSemInt:false, exceptionExtra:false, exceptionEscala:false, isDobra:false });
      });

      let html = '<table><tr><th class="sticky">Colaborador/Freela</th><th>Função</th><th>Escala</th><th>Jornada</th>';
      for (let d = 1; d <= dMax; d++) {
        html += `<th colspan="3">${String(d).padStart(2,'0')}<br><span class='muted'>${headerObs(d)}</span></th><th>Exc</th>`;
      }
      html += '<th>Indicadores</th></tr>';

      html += '<tr><th class="sticky"></th><th></th><th></th><th></th>';
      for (let d=1; d<=dMax; d++) html += '<th>E</th><th>I</th><th>S</th><th></th>';
      html += '<th></th></tr>';

      model.rows.forEach((r,ri) => {
        html += `<tr><td class="sticky">${colabEditor(ri,r)}</td>`;
        html += `<td>${funcEditor(ri,r)}</td><td>${r.escala||''}</td><td>${r.jornada||''}</td>`;
        for (let d=0; d<dMax; d++) {
          const c = r.days[d];
          const cls = cellClass(c);
          html += `<td class='${cls}'><input value='${c.entrada||''}' onchange='setCell(${ri},${d},"entrada",this.value)' list='statusList' style='width:74px'/></td>`;
          html += `<td class='${cls}'><input value='${c.intervalo||''}' onchange='setCell(${ri},${d},"intervalo",this.value)' style='width:74px'/></td>`;
          html += `<td class='${cls}'><input value='${c.saida||''}' onchange='setCell(${ri},${d},"saida",this.value)' style='width:74px'/></td>`;
          html += `<td><button onclick='toggleExc(${ri},${d},"exceptionMaxSemInt")'>M</button><button onclick='toggleExc(${ri},${d},"exceptionExtra")'>+2</button><button onclick='toggleExc(${ri},${d},"exceptionEscala")'>Esc</button><button onclick='toggleExc(${ri},${d},"isDobra")'>D</button></td>`;
        }
        html += `<td>${rowIndicators(r)}</td></tr>`;
      });

      html += '</table><datalist id="statusList">'+specialStatuses.map(s=>`<option value='${s}'></option>`).join('')+'</datalist>';
      document.getElementById('tableWrap').innerHTML = html;
    }

    function headerObs(day){
      const key = `${v('ano')}-${String(v('mes')).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const f = model.feriados[key]||[];
      const e = model.eventos[key]||[];
      const p = model.prevFat[key];
      const w = model.weather[key];
      const clima = w ? `${w.min??'—'}°/${w.max??'—'}° ${w.rain??'—'}%` : '—';
      return `${[...f,...e].join(', ')} ${p?`[${p}]`:''} | ${clima}`.trim();
    }

    function colabEditor(ri,r){
      const arr = bootstrap.colaboradores.filter(c=>c.empresa===model.empresa).map(c=>c.nome);
      const options = arr.map(n=>`<option value='${n}'></option>`).join('');
      return `<input list='colab_${ri}' value='${r.nome||''}' onchange='setColab(${ri},this.value)' style='width:160px'/><datalist id='colab_${ri}'>${options}</datalist><br><button onclick='toggleFreela(${ri})'>${r.isFreelancer?'Voltar':'Freelancer'}</button>`;
    }

    function funcEditor(ri,r){
      if(!r.isFreelancer) return r.funcao||'';
      const fun = bootstrap.funcoes.filter(f=>f.empresasTokens.includes(model.empresa)).map(f=>f.nome);
      return `<input list='func_${ri}' value='${r.funcao||''}' onchange='model.rows[${ri}].funcao=this.value' /><datalist id='func_${ri}'>${fun.map(f=>`<option value='${f}'></option>`).join('')}</datalist>`;
    }

    function setColab(ri,val){
      const c = bootstrap.colaboradores.find(x=>x.nome===val && x.empresa===model.empresa);
      if(!c) return alert('Colaborador inválido.');
      const r = model.rows[ri];
      r.isFreelancer=false; r.nome=c.nome; r.funcao=c.funcao; r.escala=c.escala; r.jornada=c.jornada;
      renderTable();
    }

    function toggleFreela(ri){
      const r = model.rows[ri];
      if(!r.isFreelancer){
        model.freelancerCount +=1;
        r.isFreelancer=true; r.nome=`Freelancer ${model.freelancerCount}`; r.funcao=''; r.escala=''; r.jornada='';
      } else { r.isFreelancer=false; r.nome=''; r.funcao=''; r.escala=''; r.jornada=''; }
      renderTable();
    }

    function setCell(ri,di,key,val){
      const r = model.rows[ri], c = r.days[di];
      val = (val||'').trim();
      if(key==='entrada' && specialStatuses.includes(val)){
        if(r.escala==='12x36' && ['Dom. mês','Abatimento'].includes(val)) return alert('12x36 não permite Dom. mês/Abatimento');
        c.entrada=val; c.intervalo=val; c.saida=val; renderTable(); return;
      }
      c[key]=val;
      if(key==='entrada' && val && !r.isFreelancer && validTime(val) && validTime(r.jornada) && validTime(v('duracaoIntervalo'))){
        const out = toMin(val)+toMin(r.jornada)+toMin(v('duracaoIntervalo'));
        c.saida = fromMin(out);
      }
      renderTable();
    }

    function toggleExc(ri,di,k){ model.rows[ri].days[di][k]=!model.rows[ri].days[di][k]; renderTable(); }

    function cellClass(c){
      if (specialStatuses.includes(c.entrada)) return 'status-'+c.entrada.replace(' ','_');
      return c.isDobra ? 'is-dobra' : '';
    }

    function rowIndicators(r){
      const domOk = r.escala==='12x36' ? true : hasDomMes(r);
      const esc = checkEscala(r);
      return `<span class='pill'>Dom mês: ${domOk?'OK':'Falta'}</span><br><span class='pill'>Escala: ${esc?'OK':'Violação'}</span>`;
    }

    function hasDomMes(r){
      return r.days.some((c,i)=>c.entrada==='Dom. mês' && new Date(Number(v('ano')),Number(v('mes'))-1,i+1).getDay()===0);
    }

    function isWork(c){ return validTime(c.entrada); }
    function isRest(c){ return ['Folga','Dom. mês','Férias','Licença'].includes(c.entrada); }

    function checkEscala(r){
      if(r.isFreelancer || !r.escala) return true;
      const maxCons = {'6x1':6,'5x2':5,'4x3':4,'12x36':1}[r.escala] ?? 99;
      let cons=0;
      for(const c of r.days){
        if(isWork(c)){ cons++; if(cons>maxCons && !c.exceptionEscala) return false; }
        else if(isRest(c)) cons=0;
      }
      return true;
    }

    function toMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
    function fromMin(x){ const h=Math.floor(x/60),m=x%60; return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }
    function v(id){ return document.getElementById(id).value; }

    function buildPayload(){
      const p = {
        empresa: v('empresa'), valorTaxi:Number(v('valorTaxi')), valorRefeicao:Number(v('valorRefeicao')),
        valorDobra:Number(v('valorDobra')), emailAnalise:v('emailAnalise'), duracaoIntervalo:v('duracaoIntervalo'), maxSemIntervalo:v('maxSemIntervalo'),
        protocolo:v('protocolo'), mes:Number(v('mes')), ano:Number(v('ano')), valorHoraFreelancer:Number(v('valorHoraFreelancer')),
        rows:model.rows, feriados:model.feriados, eventos:model.eventos, prevFat:model.prevFat,
      };
      return p;
    }

    function enviarAnalise(){
      const payload = buildPayload();
      google.script.run.withSuccessHandler(r=>{
        alert(`Protocolo: ${r.protocol}\nPDF: ${r.pdfLink}${r.emailError?`\nFalha e-mail: ${r.emailError}`:''}`);
      }).withFailureHandler(e=>alert(e.message||e)).saveAndGeneratePdfAnalise(payload);
    }

    function salvarCopia(){
      google.script.run.withSuccessHandler(r=>alert(`PDF cópia: ${r.pdfLink}`)).withFailureHandler(e=>alert(e.message||e)).generatePdfCopia(buildPayload());
    }

    function envioColab(){
      google.script.run.withSuccessHandler(r=>alert(`PDF colaboradores: ${r.pdfLink}`)).withFailureHandler(e=>alert(e.message||e)).generatePdfColaboradores(buildPayload());
    }

    function loadProtocols(){
      const list = document.getElementById('protocolos').value;
      google.script.run.withSuccessHandler(r=>{
        if(!r.merged) return alert((r.warnings||[]).join('\n')||'Nada para carregar');
        const p = r.merged;
        document.getElementById('empresa').value = p.empresa; onEmpresaChange();
        ['valorTaxi','valorRefeicao','valorDobra','emailAnalise','duracaoIntervalo','maxSemIntervalo','mes','ano','valorHoraFreelancer','protocolo']
          .forEach(k=>{ if(document.getElementById(k) && p[k]!==undefined) document.getElementById(k).value=p[k]; });
        model.rows = p.rows || model.rows;
        renderTable();
        if(r.warnings?.length) alert(r.warnings.join('\n'));
      }).withFailureHandler(e=>alert(e.message||e)).loadProtocols(list);
    }

    init();
  </script>
</body>
</html>
